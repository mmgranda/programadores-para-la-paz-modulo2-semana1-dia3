<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Comunitario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Información comunitaria desde JSON</h1>

    <p>

    <section>

      <button id="btnAvisos">Cargar avisos</button>
      <div id="contenedorAvisos">Aquí aparecerán los avisos.</div>

    <section>
      <h2>Campañas comunitarias</h2>
      <button id="btnCampanias">Cargar campañas</button>
      <div id="contenedorCampanias">Aquí aparecerán las campañas.</div>

  </main>

  <script src="app.js"></script>

</html>
